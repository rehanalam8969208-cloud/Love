<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💜 REHAN & JANNAT - Online Streamer</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #1b1f2c 0%, #0d0f14 100%); color: #ffffff; min-height: 100vh; padding-bottom: 130px; overflow-x: hidden; position: relative; }
        
        .sw-container { width:100%; max-width:480px; margin: 0 auto; padding: 18px; position: relative; z-index: 2; }
        .glass-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); color: #ffffff; }
        .tap-animate { transition: transform 0.15s ease-out; cursor: pointer; }
        .tap-animate:active { transform: scale(0.95) !important; }
        
        /* TOP HEADER */
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .brand-title { font-size:20px; font-weight:800; background: linear-gradient(45deg, #fff, #a29bfe, #fd79a8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* SEARCH BAR */
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        .search-input { flex: 1; padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; outline: none; }
        .search-btn { padding: 12px 18px; border-radius: 14px; border: none; background: linear-gradient(45deg, #6c5ce7, #fd79a8); color: #fff; font-weight: 700; cursor: pointer; }

        /* SONG CARD & OVERFLOW FIX */
        .song-card { padding: 12px 14px; border-radius: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
        .song-info { display: flex; align-items: center; gap: 12px; width: 80%; min-width: 0; }
        .song-icon { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #6c5ce7, #fd79a8); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        
        .song-details { width: 100%; min-width: 0; }
        .song-title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .song-sub { font-size: 11px; color: #8a96a3; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* MINI PLAYER BAR */
        .mini-player-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 448px; border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; z-index: 95; cursor: pointer; background: rgba(23, 27, 38, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.15); }
        .mini-player-top { display: flex; align-items: center; justify-content: space-between; }
        .ctrl-btn-round { width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; cursor: pointer; }
        .seek-bar-container { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
        .seek-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6c5ce7, #fd79a8); border-radius: 2px; }

        audio { display: none; }
    </style>
</head>
<body>

<div class="sw-container">
    <div class="top-bar">
        <div class="brand-title">💜 REHAN & JANNAT</div>
        <div style="font-size:12px; color:#a29bfe;">Online Stream</div>
    </div>

    <!-- ONLINE SEARCH BAR -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search song (e.g. No love)..." onkeypress="if(event.key==='Enter') searchMusic()">
        <button class="search-btn tap-animate" onclick="searchMusic()">Search</button>
    </div>

    <div style="margin-bottom: 14px; font-size: 14px; font-weight: 700;" id="statusHeader">Search Results</div>

    <div id="songsContainer">
        <div class="glass-box" style="text-align:center; padding: 30px 20px; color:#8a96a3;">
            <div style="font-size:32px; margin-bottom:8px;">🔍</div>
            <div style="font-size:13px;">Type any song name above to stream online!</div>
        </div>
    </div>
</div>

<!-- MINI PLAYER BAR -->
<div class="mini-player-bar">
    <div class="mini-player-top">
        <div style="width: 68%; min-width: 0;">
            <div class="song-title" id="miniTitle">Select or Search Song</div>
            <div class="song-sub" id="miniArtist">Online Streamer</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="ctrl-btn-round tap-animate" id="miniPlayBtn" onclick="togglePlay()" style="background:#6c5ce7;">▶</div>
        </div>
    </div>
    <div class="seek-bar-container" onclick="seekAudio(event)">
        <div class="seek-bar-fill" id="miniProgressFill"></div>
    </div>
</div>

<audio id="audioPlayer" ontimeupdate="updateProgress()"></audio>

<script>
let audio = document.getElementById('audioPlayer');

async function searchMusic() {
    let query = document.getElementById('searchInput').value.trim();
    if(!query) return;
    
    let container = document.getElementById('songsContainer');
    container.innerHTML = '<div style="text-align:center; padding:30px; color:#a29bfe;">Searching music streams...</div>';
    
    // iTunes API (100% Reliable, Never Fails)
    try {
        let res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=15`);
        let data = await res.json();
        
        if(!data.results || data.results.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:30px; color:#8a96a3;">No tracks found. Try another term.</div>';
            return;
        }

        container.innerHTML = '';
        data.results.forEach(item => {
            let div = document.createElement('div');
            div.className = 'song-card tap-animate';
            div.onclick = () => playStream(item.previewUrl, item.trackName, item.artistName);
            div.innerHTML = `
                <div class="song-info">
                    <div class="song-icon">🎵</div>
                    <div class="song-details">
                        <div class="song-title">${item.trackName}</div>
                        <div class="song-sub">${item.artistName || 'Artist'} - ${item.collectionName || 'Single'}</div>
                    </div>
                </div>
                <div style="color:#fd79a8; font-size:16px;">▶</div>
            `;
            container.appendChild(div);
        });
    } catch (e) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#ff4c4c;">Network Error. Please check internet access!</div>';
    }
}

function playStream(url, title, artist) {
    if(!url) return;
    document.getElementById('miniTitle').textContent = title;
    document.getElementById('miniArtist').textContent = artist || 'Online Track';
    
    audio.src = url;
    audio.play();
    document.getElementById('miniPlayBtn').textContent = '⏸';
}

function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) {
        audio.play();
        document.getElementById('miniPlayBtn').textContent = '⏸';
    } else {
        audio.pause();
        document.getElementById('miniPlayBtn').textContent = '▶';
    }
}

function updateProgress() {
    if (audio.duration) {
        let pct = (audio.currentTime / audio.duration * 100) + '%';
        document.getElementById('miniProgressFill').style.width = pct;
    }
}

function seekAudio(e) {
    if(!audio.duration) return;
    let rect = e.currentTarget.getBoundingClientRect();
    let clickX = e.clientX - rect.left;
    audio.currentTime = (clickX / rect.width) * audio.duration;
}
</script>
</body>
</html>
